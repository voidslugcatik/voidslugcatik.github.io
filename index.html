<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voidslugcat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Фоновые оверлеи -->
    <div id="hover-bg-overlay-1" class="hover-bg-overlay"></div>
    <div id="hover-bg-overlay-2" class="hover-bg-overlay"></div>
    <div class="hover-bg-icon">
        <div class="hover-bg-layer" id="bg-icon-1"><i class="fa-brands fa-youtube"></i></div>
        <div class="hover-bg-layer" id="bg-icon-2"><i class="fa-brands fa-youtube"></i></div>
    </div>

    <div class="container">
        <aside class="left-panel">
            <div class="avatar">
                <img src="ava.jpg" alt="voidslugcat avatar" />
            </div>
            <h1>voidslugcat</h1>
            <p class="description i18n-text" data-i18n="bio"></p>
            <div class="lang-switch" id="langSwitch">
                <div class="lang-slider" id="langSlider"></div>
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="ru">RU</button>
            </div>
        </aside>

        <main class="right-panel">
            <div class="links-grid" id="linksGrid">
                <!-- Плитки генерируются скриптом -->
            </div>
        </main>
    </div>

    <!-- Модальное окно -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
