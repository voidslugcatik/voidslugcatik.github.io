<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>voidslugcat</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #eee;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar {
            /* Уменьшили размер до 90px (было 100px) */
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            
            /* Скругление контейнера + обрезаем всё, что выходит за границы */
            border-radius: 50%;
            overflow: hidden;
            
            /* Лёгкая тень вокруг аватара */
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.3);
            
            /* Убираем фоновый градиент – теперь фон не нужен */
            background: transparent;
            
            /* Для центрирования img (можно и без flex, т.к. img сам заполнит) */
            display: block;
            line-height: 0;
        }

        .avatar img {
            /* Картинка полностью заполняет контейнер */
            width: 100%;
            height: 100%;
            object-fit: cover;   /* сохраняет пропорции, обрезая лишнее */
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }

        .username {
            color: #a0a0c0;
            font-size: 0.95rem;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ddd;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .link:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: #fff;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .link .icon {
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
            color: inherit;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #666688;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Аватар с картинкой -->
        <div class="avatar">
            <img src="logo_b-r.png" alt="voidslugcat logo">
        </div>
        <h1>voidslugcat</h1>
        <p class="username">@voidslugcat</p>

        <div class="links">
            <!-- ссылки без изменений -->
            <a href="https://www.youtube.com/@voidslugcat" target="_blank" class="link">
                <span class="icon"><i class="fa-brands fa-youtube"></i></span> YouTube
            </a>
            <a href="https://ru.pinterest.com/voidslugcat/" target="_blank" class="link">
                <span class="icon"><i class="fa-brands fa-pinterest"></i></span> Pinterest
            </a>
            <a href="https://t.me/domain_voidslugcat" target="_blank" class="link">
                <span class="icon"><i class="fa-brands fa-telegram"></i></span> Telegram
            </a>
            <a href="https://bsky.app/profile/voidslugcat.bsky.social" target="_blank" class="link">
                <span class="icon"><i class="fa-brands fa-bluesky"></i></span> Bluesky
            </a>
            <a href="https://github.com/voidslugcatik" target="_blank" class="link">
                <span class="icon"><i class="fa-brands fa-github"></i></span> GitHub
            </a>
            <a href="https://discord.com/users/979652228237369354" target="_blank" class="link">
                <span class="icon"><i class="fa-brands fa-discord"></i></span> Discord
            </a>
            <a href="https://steamcommunity.com/id/voidslugcat/" target="_blank" class="link">
                <span class="icon"><i class="fa-brands fa-steam"></i></span> Steam
            </a>
        </div>

        <div class="footer">voidslugcat</div>
    </div>
</body>
</html>
